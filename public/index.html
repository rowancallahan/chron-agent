<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Fixed scale on phones (no zooming in or out), drawn edge to edge, and the keyboard shrinks the page
     instead of covering it (Android; iPhone is handled by fitScreen() in app.js) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>todo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<!-- Fonts: start connecting early, and never hold up or redraw the page for them: if they're not here
     within a moment, this visit keeps the system font (no jump), and the next visit has them -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=optional" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<!-- The help pages linked from Settings, fetched quietly ahead of time (on iPhone, sw.js keeps copies instead) -->
<link rel="prefetch" href="iphone">
<link rel="prefetch" href="phone">
<!-- Add to Home Screen: name, icon, full-screen (needed for push on iPhone) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="chron">
<meta name="theme-color" content="#F7F9F8">  <!-- the header's color, so the phone's top bar blends in -->
</head>
<body>
<header>
  <nav class="tabs" aria-label="Main view">
    <button id="tab-chat" data-act="tab-chat">Chat</button><button id="chat-pop" class="pop-out" data-act="pop-chat" title="Open chat beside the other tabs" aria-label="Open chat beside the other tabs">↗</button>
    <button id="tab-rem" data-act="tab-rem">Reminders</button>
    <button id="tab-doc" data-act="tab-doc">Todo</button>
    <button id="tab-set" data-act="tab-set">Settings</button>
  </nav>
</header>

<div class="layout">
  <main id="main" class="panel"></main>

  <aside class="panel" aria-label="Chat">
    <div class="bar"><h2>Chat</h2><button id="chat-close" class="icon" data-act="close-chat" title="Close (chat stays in the Chat tab)" aria-label="Close chat">×</button></div>
    <div id="log">  <!-- placeholder bubbles until the chat loads (the first visit on this device) -->
      <div class="msg you ghost" style="width:40%"></div><div class="msg agent ghost" style="width:70%"></div>
      <div class="msg you ghost" style="width:30%"></div><div class="msg agent ghost" style="width:60%"></div>
    </div>
    <form id="chat">
      <label for="chat-input" class="sr">Message</label>
      <textarea id="chat-input" rows="1" placeholder="Message…" enterkeyhint="send" autocapitalize="sentences" autocomplete="off" spellcheck="true"></textarea>
      <button class="primary send" aria-label="Send" disabled><svg class="i-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="i-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/></svg></button>
    </form>
  </aside>
</div>

<!-- The box that opens when you click a reminder, or "+ Add a reminder" -->
<dialog id="rem-box" aria-label="Reminder">
  <form id="rem-form">
    <input name="title" class="rem-title" placeholder="Reminder" aria-label="Reminder" required>
    <input name="fires_at" type="datetime-local" aria-label="Time" required>
    <textarea name="note" rows="3" placeholder="Note (optional)" aria-label="Note"></textarea>
    <select name="repeat" aria-label="Repeat">
      <option value="once">Once</option><option value="daily">Every day</option>
      <option value="weekly">Every week</option><option value="monthly">Every month</option>
    </select>
    <label class="rem-check"><input type="checkbox" name="agent"> Wake the agent to decide what to do</label>
    <div id="rem-send" class="rem-send"></div>
    <div class="rem-buttons">
      <button type="button" class="link-btn" data-act="rem-delete">Delete</button>
      <button type="button" data-act="rem-cancel">Cancel</button>
      <button class="primary">Save</button>
    </div>
  </form>
</dialog>

<!-- A short message at the bottom of the screen when something you did failed (say() in app.js) -->
<div id="status" role="status" hidden></div>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="app.js"></script>
<!-- Notifications (py/src/notify/): the shared part, then one file per channel that has its own Settings row -->
<script src="notify.js"></script>
<script src="notify/push.js"></script>
<script src="notify/email.js"></script>
<script src="notify/call.js"></script>
<script src="notify/text.js"></script>
<!-- Extra agent tools (py/src/tools/): the shared part, then one file per tool that has its own Settings row -->
<script src="tools.js"></script>
<script src="tools/calendar.js"></script>

</body>
</html>
