<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img">
<title>chron.work systems diagram</title>
<desc>The page goes through Cloudflare Access to the worker. Each person has a Doc object and a Reminders object. Inside the Reminders object, the alarm wakes the agent loop, which goes back and forth with OpenRouter, the reminders data and the Doc object, and sends out through the notify plugins. Firing reminders also go straight to the plugins.</desc>
<style>
  text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  .note { font-size: 12px; fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="740" fill="#FFFFFF"/>
<g class="gray"><rect x="220" y="30" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Your phone or browser</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">public/ app.js, notify/*.js</text></g>
<line x1="340" y1="86" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="220" y="116" width="240" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Cloudflare Access sign-in</text></g>
<line x1="340" y1="160" x2="340" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="220" y="190" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="209" text-anchor="middle" dominant-baseline="central">Worker: entry.py</text><text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">Routes, one pair per email</text></g>
<path d="M290 246 L290 268 L140 268 L140 328" class="arr" marker-end="url(#arrow)"/>
<path d="M390 246 L390 268 L470 268 L470 286" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="300" y="288" width="340" height="212" rx="20" stroke-width="0.5"/><text class="th" x="470" y="310" text-anchor="middle" dominant-baseline="central">Reminders object</text></g>
<g class="purple"><rect x="330" y="330" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="349" text-anchor="middle" dominant-baseline="central">Chat, reminders, alarm</text><text class="ts" x="470" y="368" text-anchor="middle" dominant-baseline="central">reminders.py</text></g>
<line x1="470" y1="389" x2="470" y2="418" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="purple"><rect x="330" y="420" width="280" height="56" rx="8" stroke-width="1"/><text class="th" x="470" y="439" text-anchor="middle" dominant-baseline="central">Agent loop</text><text class="ts" x="470" y="458" text-anchor="middle" dominant-baseline="central">agent.py: model ↔ tools, ≤10 rounds</text></g>
<g class="teal"><rect x="40" y="330" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="349" text-anchor="middle" dominant-baseline="central">Doc object</text><text class="ts" x="140" y="368" text-anchor="middle" dominant-baseline="central">todo.md and versions</text></g>
<path d="M327 448 L140 448 L140 389" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="gray"><rect x="40" y="520" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="539" text-anchor="middle" dominant-baseline="central">OpenRouter</text><text class="ts" x="140" y="558" text-anchor="middle" dominant-baseline="central">Claude, streamed</text></g>
<path d="M380 479 L380 548 L243 548" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M610 358 L628 358 L628 538" class="arr" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="540" y1="476" x2="540" y2="538" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="420" y="540" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="559" text-anchor="middle" dominant-baseline="central">notify/ plugins</text><text class="ts" x="530" y="578" text-anchor="middle" dominant-baseline="central">Push, email, text</text></g>
<line x1="530" y1="596" x2="530" y2="628" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="420" y="630" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="649" text-anchor="middle" dominant-baseline="central">Outside services</text><text class="ts" x="530" y="668" text-anchor="middle" dominant-baseline="central">Push, Cloudflare, Twilio</text></g>
<text class="note" x="40" y="626">Solid: the agent's loop</text>
<text class="note" x="40" y="646">Dashed: reminders firing, no agent</text>
<text class="note" x="40" y="700">Teal, purple = your code · grey = outside</text>
</svg>
